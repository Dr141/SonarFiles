# Project-wide Gradle settings.
# Aumenta a memoria heap do Gradle para 4GB e metaspace para 1GB, evitando OutOfMemoryError no D8 / KSP / Compose
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -Dfile.encoding=UTF-8

# Otimizacoes de desempenho de build do Gradle
org.gradle.parallel=true
org.gradle.caching=true

# Configuracoes AndroidX e Kotlin
android.useAndroidX=true
android.nonTransitiveRClass=true

# Memoria dedicada para o daemon do Kotlin e KSP
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.incremental=true
ksp.incremental=true

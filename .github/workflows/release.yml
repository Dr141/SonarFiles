name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versão (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'
      target_branch:
        description: 'Branch de origem para PR e Merge na main (opcional, detectada automaticamente se vazia)'
        required: false
        default: ''
      prerelease:
        description: 'Marcar como Pré-lançamento (Prerelease)?'
        required: false
        type: boolean
        default: false
      draft:
        description: 'Criar como Rascunho (Draft)?'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  build-and-release:
    name: Build & Release APK / AAB
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🌐 Buscar todas as referências remotas
        run: |
          git fetch origin "+refs/heads/*:refs/remotes/origin/*" --tags --force

      - name: ☕ Configurar JDK 17 (Eclipse Adoptium Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐘 Configurar Gradle com Cache Otimizado
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Configurar Assinatura de Release (Keystore)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VAL: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS_VAL: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decodificando Keystore a partir de GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASS" >> $GITHUB_ENV
            echo "KEY_ALIAS=$KEY_ALIAS_VAL" >> $GITHUB_ENV
            echo "KEY_PASSWORD=$KEY_PASS_VAL" >> $GITHUB_ENV
          else
            echo "⚠️ Secrets de Keystore não detectados. O build usará assinatura debug para teste de release."
          fi

      - name: 🔨 Compilar APK e App Bundle (AAB)
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: 📦 Preparar Artefatos e Checksums (SHA-256)
        id: prepare_artifacts
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG:-v1.0.0}"
          echo "Tag de Versão: $VERSION"
          
          mkdir -p release_artifacts
          
          # Copia e renomeia o APK
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            APK_SRC="app/build/outputs/apk/release/app-release-unsigned.apk"
          fi
          
          APK_DEST="release_artifacts/SonarFiles-${VERSION}.apk"
          cp "$APK_SRC" "$APK_DEST"

          # Copia e renomeia o AAB (Bundle para Google Play)
          AAB_SRC="app/build/outputs/bundle/release/app-release.aab"
          AAB_DEST="release_artifacts/SonarFiles-${VERSION}.aab"
          cp "$AAB_SRC" "$AAB_DEST"

          # Gera Checksums SHA-256 para integridade
          cd release_artifacts
          sha256sum "SonarFiles-${VERSION}.apk" > checksums.txt
          sha256sum "SonarFiles-${VERSION}.aab" >> checksums.txt
          cd ..

          echo "apk_path=$APK_DEST" >> $GITHUB_OUTPUT
          echo "aab_path=$AAB_DEST" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: 🚀 Criar GitHub Release e Anexar Binários
        uses: softprops/action-gh-release@v2
        with:
          name: "SonarFiles ${{ steps.prepare_artifacts.outputs.version }}"
          tag_name: ${{ steps.prepare_artifacts.outputs.version }}
          files: |
            release_artifacts/SonarFiles-*.apk
            release_artifacts/SonarFiles-*.aab
            release_artifacts/checksums.txt
          generate_release_notes: true
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔀 Criar Pull Request e Fazer Merge com a Main
        id: pr_and_merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          VERSION="${RAW_TAG:-v1.0.0}"
          INPUT_BRANCH="${{ github.event.inputs.target_branch }}"

          echo "🔍 Identificando a branch de origem para o commit $GITHUB_SHA..."

          if [ -n "$INPUT_BRANCH" ]; then
            SOURCE_BRANCH="$INPUT_BRANCH"
          else
            # Localiza todas as branches remotas que contêm o commit atual da tag
            CANDIDATE_BRANCHES=$(git branch -r --contains "$GITHUB_SHA" | sed 's|origin/||' | sed 's|HEAD -> .*||' | tr -d ' *' | grep -v '^$' | grep -v '^main$')
            SOURCE_BRANCH=$(echo "$CANDIDATE_BRANCHES" | head -n 1)
          fi

          echo "📌 Branch de origem selecionada: '$SOURCE_BRANCH'"

          if [ -z "$SOURCE_BRANCH" ]; then
            echo "ℹ️ A tag $VERSION foi gerada diretamente na branch 'main' ou nenhuma branch secundária foi identificada. Nenhuma ação de PR necessária."
            exit 0
          fi

          # Atualiza estado local da main e da branch de origem
          git fetch origin main
          git fetch origin "$SOURCE_BRANCH"

          # Verifica se o commit da branch já é ancestral direto da main (já mesclado)
          if git merge-base --is-ancestor "origin/$SOURCE_BRANCH" "origin/main"; then
            echo "✅ A branch '$SOURCE_BRANCH' já se encontra totalmente integrada na 'main'. Pulando criação de PR."
            exit 0
          fi

          echo "🚀 Abrindo/Localizando Pull Request de '$SOURCE_BRANCH' para 'main'..."

          # Verifica se já existe um PR aberto para essa branch
          EXISTING_PR=$(gh pr list --head "$SOURCE_BRANCH" --base main --state open --json number --jq '.[0].number' 2>/dev/null || echo "")

          PR_NUM=""
          if [ -z "$EXISTING_PR" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$SOURCE_BRANCH" \
              --title "chore(release): merge $SOURCE_BRANCH into main ($VERSION)" \
              --body "Release $VERSION concluída e publicada com sucesso a partir da branch $SOURCE_BRANCH." 2>/dev/null || echo "")

            if [ -n "$PR_URL" ]; then
              echo "✅ Pull Request criado com sucesso: $PR_URL"
              PR_NUM=$(gh pr list --head "$SOURCE_BRANCH" --base main --state open --json number --jq '.[0].number' 2>/dev/null || echo "")
            else
              echo "⚠️ Não foi possível criar o PR via GitHub CLI (possível restrição de permissão de Actions no repositório)."
            fi
          else
            echo "ℹ️ Pull Request aberto já existente detectado: #$EXISTING_PR"
            PR_NUM="$EXISTING_PR"
          fi

          # Tenta realizar o merge do PR via gh CLI
          MERGED=false
          if [ -n "$PR_NUM" ]; then
            echo "🔀 Tentando mesclar o Pull Request #$PR_NUM via GitHub CLI..."
            if gh pr merge "$PR_NUM" --merge --subject "chore(release): merge $SOURCE_BRANCH into main ($VERSION)" 2>/dev/null; then
              echo "🎉 Pull Request #$PR_NUM mesclado com sucesso na branch 'main'!"
              MERGED=true
            else
              echo "⚠️ gh pr merge encontrou restrição de política. Executando fallback via Git direto..."
            fi
          fi

          # Fallback de merge direto via Git caso gh pr merge falhe ou PR não tenha sido criado
          if [ "$MERGED" = false ]; then
            echo "⚙️ Executando sincronização e merge direto na branch 'main' via Git..."
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout -B main origin/main
            git merge "origin/$SOURCE_BRANCH" --no-edit -m "chore(release): merge $SOURCE_BRANCH into main ($VERSION)"
            git push origin main
            echo "🎉 Branch 'main' sincronizada e enviada para o repositório com sucesso!"
          fi
